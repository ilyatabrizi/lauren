<!doctype html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<title>LAUREN</title>
<script>
  /* GitHub Pages serves this for unknown paths. The store is a hash-routed
     SPA, so bounce back to the shell and keep whatever hash was asked for. */
  location.replace(location.pathname.replace(/\/[^/]*$/, '/') + 'index.html' + location.hash);
</script>
</head>
<body style="background:#0a0a0b"></body>
</html>
